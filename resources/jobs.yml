resources:
  jobs:
    inventory_risk_radar_e2e:
      name: inventory-risk-radar-e2e
      description: "End-to-end Retail Inventory Risk Radar: raw data -> Lakeflow pipeline -> forecast -> risk scoring -> Gen AI notes -> governance -> Lakebase serving"
      max_concurrent_runs: 1
      tags:
        project: inventory_risk_radar
      schedule:
        quartz_cron_expression: "0 0 5 * * ?"   # daily 05:00 after POS close; paused in dev via presets
        timezone_id: America/Chicago
      email_notifications:
        on_failure:
          - adarsh.nandan@databricks.com
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: as_of_date
          default: ${var.as_of_date}
        - name: llm_endpoint
          default: ${var.llm_endpoint}
        - name: drift_threshold_pct
          default: "10"
        - name: app_sp_client_id
          default: ${resources.apps.planner_app.service_principal_client_id}
      tasks:
        - task_key: generate_raw_data
          description: "Land synthetic source-system files in the UC Volume (stands in for POS/ERP/WMS exports)"
          notebook_task:
            notebook_path: ../src/datagen/generate_raw_data.py

        - task_key: lakeflow_pipeline
          description: "Lakeflow Declarative Pipeline: bronze -> silver -> gold"
          depends_on: [{task_key: generate_raw_data}]
          pipeline_task:
            pipeline_id: ${resources.pipelines.inventory_risk_pipeline.id}
            full_refresh: true

        - task_key: drift_check
          description: "Score the @champion on the latest 28 days; decide whether to retrain (accuracy drift, lost to baseline, stale, or no champion)"
          depends_on: [{task_key: lakeflow_pipeline}]
          notebook_task:
            notebook_path: ../src/ml/drift_check.py
            base_parameters:
              drift_threshold_pct: "{{job.parameters.drift_threshold_pct}}"

        - task_key: needs_retrain
          description: "Condition: retrain only when the drift check says so"
          depends_on: [{task_key: drift_check}]
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.drift_check.values.retrain}}"
            right: "true"

        - task_key: train_forecast
          description: "Retrain: baseline vs LightGBM, MLflow tracking, promote to @champion only if it beats baseline and the current champion"
          depends_on: [{task_key: needs_retrain, outcome: "true"}]
          max_retries: 1
          notebook_task:
            notebook_path: ../src/ml/train_forecast.py
            base_parameters:
              experiment_name: ${resources.experiments.demand_forecast_experiment.name}

        - task_key: batch_forecast
          description: "28-day forecast with whichever model holds @champion (retrained or existing)"
          depends_on:
            - task_key: train_forecast
            - task_key: needs_retrain
              outcome: "false"
          run_if: AT_LEAST_ONE_SUCCESS
          notebook_task:
            notebook_path: ../src/ml/batch_forecast.py

        - task_key: score_risk
          depends_on: [{task_key: batch_forecast}]
          notebook_task:
            notebook_path: ../src/risk/score_risk.py

        - task_key: genai_explanations
          depends_on: [{task_key: score_risk}]
          notebook_task:
            notebook_path: ../src/risk/genai_explanations.py

        - task_key: evaluate_explanations
          description: "Quality gate for Gen AI notes: deterministic faithfulness checks + LLM judge, logged to MLflow; failing notes fall back to the template"
          depends_on: [{task_key: genai_explanations}]
          notebook_task:
            notebook_path: ../src/risk/evaluate_explanations.py
            base_parameters:
              eval_experiment: ${resources.experiments.planner_note_eval_experiment.name}

        - task_key: apply_governance
          depends_on: [{task_key: evaluate_explanations}]
          notebook_task:
            notebook_path: ../src/governance/apply_governance.py

        - task_key: metric_views
          description: "UC metric views with the retailer's KPI definitions"
          depends_on: [{task_key: apply_governance}]
          notebook_task:
            notebook_path: ../src/metrics/create_metric_views.py

        - task_key: lakebase_sync_and_export
          description: "Refresh Lakebase synced table for the app; land planner actions back in Delta"
          depends_on: [{task_key: metric_views}]
          notebook_task:
            notebook_path: ../src/lakebase/refresh_and_export.py
            base_parameters:
              lakebase_endpoint: projects/${var.lakebase_project}/branches/production/endpoints/primary
              pg_database: ${resources.postgres_databases.app_db.postgres_database}
