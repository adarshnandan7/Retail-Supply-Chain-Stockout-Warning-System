resources:
  apps:
    planner_app:
      name: inventory-risk-radar
      description: "Planner UI: ranked stockout risks with drivers, decisions written to Lakebase, Genie Q&A"
      source_code_path: ../src/app
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: postgres
          postgres:
            branch: ${resources.postgres_projects.inventory_risk_lakebase.name}/branches/production
            database: ${resources.postgres_projects.inventory_risk_lakebase.name}/branches/production/databases/${resources.postgres_databases.app_db.database_id}
            permission: CAN_CONNECT_AND_CREATE
        - name: genie-space
          genie_space:
            name: inventory-risk-genie
            space_id: ${resources.genie_spaces.inventory_risk_genie.id}
            permission: CAN_RUN
        - name: demand-forecast
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.demand_forecast
            securable_type: TABLE
            permission: SELECT
        - name: inbound-pos
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.gold_inbound_po_pipeline
            securable_type: TABLE
            permission: SELECT
        - name: inventory-position
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.gold_current_inventory_position
            securable_type: TABLE
            permission: SELECT
        - name: risk-recommendations
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.risk_recommendations
            securable_type: TABLE
            permission: SELECT
      permissions:
        - group_name: users
          level: CAN_USE
